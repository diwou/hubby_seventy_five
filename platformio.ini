; PlatformIO Project Configuration File
; HUB75 NTP Flip Clock — ESP32-S3 WROOM N16R8

[platformio]
default_envs = freenove_esp32_s3_wroom_ota

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
extra_scripts = pre:scripts/version_label.py, post:scripts/export_firmware.py
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=0
upload_port = /dev/ttyACM0
lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.14
	adafruit/Adafruit GFX Library@^1.12.5
	mathieucarbou/ESPAsyncWebServer@^3.3.0
	mathieucarbou/AsyncTCP@^3.2.0
	bblanchon/ArduinoJson@^7.2.0

[env:freenove_esp32_s3_wroom_ota]
extends = env:freenove_esp32_s3_wroom
upload_protocol = espota
upload_port = 10.10.60.117
